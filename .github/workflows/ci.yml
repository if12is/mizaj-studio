name: Mizaj Studio CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      MIZAJ_ENGINE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .; fi
      - name: Verify Model Downloader Dry-Run
        run: python scripts/download_models.py --dry-run
      - name: Verify domain packs and catalog checksums are up to date
        run: python scripts/build_domain_packs.py --check
      - name: Run Pytest Suite (Mock Mode)
        working-directory: ./backend
        run: |
          if [ -d tests ]; then pytest -v; fi
      - name: Audit Python dependencies (pip-audit)
        working-directory: ./backend
        run: |
          pip install "$(grep -E '^pip-audit==' requirements-build.txt)"
          ARGS=""
          if [ -f pip-audit-ignore.txt ]; then
            for id in $(grep -vE '^[[:space:]]*(#|$)' pip-audit-ignore.txt | awk '{print $1}'); do
              ARGS="$ARGS --ignore-vuln $id"
            done
          fi
          pip-audit -r requirements.txt $ARGS

  backend-windows:
    runs-on: windows-latest
    env:
      MIZAJ_ENGINE_MODE: mock
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run Pytest Suite (Mock Mode, Windows)
        working-directory: ./backend
        run: pytest -q

  desktop-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20.11.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
      - name: Build & Typecheck Desktop App
        working-directory: ./desktop
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint --if-present
            npm run typecheck
            npm run test:unit --if-present
            npm run build
          fi

  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIZAJ_ENGINE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Set up Node.js 20.11.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb unzip
      - name: Electron E2E (real sidecar, mock engine)
        working-directory: ./desktop
        env:
          MIZAJ_PYTHON: python
        run: |
          npm ci
          npm run test:e2e
      - name: Performance budgets (7.7.2)
        working-directory: ./desktop
        env:
          MIZAJ_PYTHON: python
        run: npm run test:perf
      - name: SBOM and license policy (npm + python)
        working-directory: ./desktop
        run: node scripts/sbom.cjs --python python --out sbom/sbom.json

  desktop-unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Unit tests (Windows)
        working-directory: ./desktop
        run: |
          npm ci
          npm run test:unit
