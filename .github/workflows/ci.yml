name: Mizaj Studio CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      MIZAJ_ENGINE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .; fi
      - name: Verify Model Downloader Dry-Run
        run: python scripts/download_models.py --dry-run
      - name: Run Pytest Suite (Mock Mode)
        working-directory: ./backend
        run: |
          if [ -d tests ]; then pytest -v; fi

  desktop-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20.11.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
      - name: Build & Typecheck Desktop App
        working-directory: ./desktop
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint --if-present
            npm run typecheck
            npm run test:unit --if-present
            npm run build
          fi
