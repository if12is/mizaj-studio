name: Mizaj Studio CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      MIZAJ_ENGINE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Ruff Linter
        working-directory: ./backend
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .; fi
      - name: Verify Model Downloader Dry-Run
        run: python scripts/download_models.py --dry-run
      - name: Verify domain packs and catalog checksums are up to date
        run: python scripts/build_domain_packs.py --check
      - name: Run Pytest Suite (Mock Mode)
        working-directory: ./backend
        run: |
          if [ -d tests ]; then pytest -v; fi
      - name: Audit Python dependencies (pip-audit)
        working-directory: ./backend
        run: |
          pip install "$(grep -E '^pip-audit==' requirements-build.txt)"
          ARGS=""
          if [ -f pip-audit-ignore.txt ]; then
            for id in $(grep -vE '^[[:space:]]*(#|$)' pip-audit-ignore.txt | awk '{print $1}'); do
              ARGS="$ARGS --ignore-vuln $id"
            done
          fi
          pip-audit -r requirements.txt $ARGS

  backend-windows:
    runs-on: windows-latest
    env:
      MIZAJ_ENGINE_MODE: mock
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run Pytest Suite (Mock Mode, Windows)
        working-directory: ./backend
        run: pytest -q

  desktop-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20.11.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
      - name: Install desktop dependencies
        working-directory: ./desktop
        timeout-minutes: 10
        run: npm ci
      - name: Lint
        working-directory: ./desktop
        timeout-minutes: 10
        run: npm run lint
      - name: Typecheck
        working-directory: ./desktop
        timeout-minutes: 10
        run: npm run typecheck
      - name: Unit tests
        working-directory: ./desktop
        timeout-minutes: 10
        run: |
          set +e
          timeout -k 10 360 npx vitest run --reporter=verbose > "$RUNNER_TEMP/vitest.log" 2>&1
          rc=$?
          tail -n 15 "$RUNNER_TEMP/vitest.log"
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            msg=$(tail -n 30 "$RUNNER_TEMP/vitest.log" | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '\r' | sed 's/\r/%0A/g')
            echo "::error title=vitest hang::$msg"
          fi
          exit $rc
      - name: Build
        working-directory: ./desktop
        timeout-minutes: 15
        run: npm run build

  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIZAJ_ENGINE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Set up Node.js 20.11.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb unzip
      - name: Electron E2E (real sidecar, mock engine)
        working-directory: ./desktop
        env:
          MIZAJ_PYTHON: python
        run: |
          npm ci
          npm run test:e2e
      - name: Performance budgets (7.7.2)
        working-directory: ./desktop
        env:
          MIZAJ_PYTHON: python
        run: npm run test:perf
      - name: SBOM and license policy (npm + python)
        working-directory: ./desktop
        run: node scripts/sbom.cjs --python python --out sbom/sbom.json

  desktop-unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Unit tests (Windows)
        working-directory: ./desktop
        timeout-minutes: 15
        shell: pwsh
        run: |
          npm ci
          # Watchdog: an intermittent hang was seen here; on timeout, report where it stopped.
          $log = "$env:RUNNER_TEMP\vitest.log"
          $p = Start-Process -FilePath npx.cmd -ArgumentList 'vitest','run','--reporter=verbose' -RedirectStandardOutput $log -RedirectStandardError "$log.err" -NoNewWindow -PassThru
          if (-not $p.WaitForExit(480000)) {
            $tail = ((Get-Content $log -Tail 25) + (Get-Content "$log.err" -Tail 10)) -join '%0A'
            Write-Host "::error title=vitest hang::$tail"
            taskkill /T /F /PID $p.Id | Out-Null
            exit 1
          }
          Get-Content $log -Tail 15
          exit $p.ExitCode
