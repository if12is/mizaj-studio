name: Release

# Build the Windows installer (frozen engine + models + Electron) and publish a GitHub Release.
# Modelled on if12is/MaT3am electron-release.yml. See desktop/RELEASING.md.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.1 (empty = keep desktop/package.json version)'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub Release (false = build + upload artifacts only)'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner'
        required: false
        type: choice
        options:
          - github-hosted
          - self-hosted
        default: github-hosted

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Windows"]') || 'windows-latest' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide publish mode
        id: mode
        run: |
          $publish = ('${{ github.event_name }}' -eq 'push') -or ('${{ inputs.publish }}' -eq 'true')
          $mode = if ($publish) { 'always' } else { 'never' }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "publish=$publish mode=$mode"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync version from tag / input
        id: version
        working-directory: desktop
        run: node scripts/sync-version.cjs

      # Reproducible builds (7.6.6): timestamps inside archives derive from the commit, and Python's
      # hash randomisation is off for PyInstaller. See docs/guides/reproducible-builds.md.
      - name: Reproducible-build environment
        run: |
          $epoch = (git log -1 --format=%ct).Trim()
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV
          'PYTHONHASHSEED=0' >> $env:GITHUB_ENV
          Write-Host "SOURCE_DATE_EPOCH=$epoch"

      - name: Preflight
        run: |
          if ('${{ steps.mode.outputs.publish }}' -eq 'true' -and [string]::IsNullOrEmpty($env:GH_TOKEN)) {
            throw 'Publishing requested but GITHUB_TOKEN is not available.'
          }

      - name: Generate release notes from commits
        run: |
          $prev = git describe --tags --abbrev=0 'HEAD^' 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prev) { $prev = $null; $global:LASTEXITCODE = 0 }
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $log = git log --no-merges --pretty=format:'- %s (%h)' $range
          $head = "## Mizaj Studio v${{ steps.version.outputs.version }}`n`n"
          $note = if ($prev) { "Changes since $prev`:`n`n" } else { "Initial release`:`n`n" }
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value ($head + $note + ($log -join "`n")) -Encoding utf8
          Get-Content "$env:RUNNER_TEMP/release-notes.md"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Quality gate - backend tests (mock engine)
        working-directory: backend
        env:
          MIZAJ_ENGINE_MODE: mock
        run: python -m pytest -q

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Quality gate - lint, typecheck, unit tests
        working-directory: desktop
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Download CATT models (sha256 verified)
        run: python scripts/download_models.py

      - name: Quantize CATT encoder to INT8 (fails if DER regresses > 0.3 pt)
        env:
          MIZAJ_ENGINE_MODE: real
        run: python scripts/quantize_catt.py --guard 0.3

      # The catalog URLs are releases/latest/download/<name> with a static sha256. The packs are
      # byte-deterministic (stored zip members, fixed timestamps), so rebuilding on this runner must
      # reproduce the committed files and the catalog checksums exactly; otherwise fail the release.
      # The packs embed a SQLite file whose header records the SQLite version, so bytes differ
      # between platforms: rebuild packs AND catalog here, before the engine bundles the catalog,
      # so the shipped checksums always match the assets this release publishes.
      - name: Build domain packs (.mizajpack) and their catalog checksums
        run: |
          python scripts/build_domain_packs.py
          python scripts/build_domain_packs.py --check

      # Bootloader compiled from source + VERSIONINFO: avoids the prebuilt-bootloader
      # signatures that trigger antivirus false positives (see desktop/WINDOWS_DEFENDER.md).
      - name: Build frozen engine (PyInstaller)
        env:
          MIZAJ_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/build_backend.py --rebuild-bootloader

      - name: Generate SBOM and third-party license report (fails on incompatible licenses)
        working-directory: desktop
        run: node scripts/sbom.cjs --python python --out sbom/sbom.json

      - name: Smoke-test frozen engine
        run: ./desktop/scripts/smoke-engine.ps1 -DataDir "$env:RUNNER_TEMP\smoke"

      - name: Build app
        working-directory: desktop
        run: npm run build

      - name: Package installer (electron-builder)
        working-directory: desktop
        run: npx electron-builder --win --publish ${{ steps.mode.outputs.mode }}

      - name: Delta-update report (blockmap sizes) appended to the release notes
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = Get-Item "desktop/dist/Mizaj-Studio-Setup-$v.exe"
          $bm = Get-Item "desktop/dist/Mizaj-Studio-Setup-$v.exe.blockmap"
          $packs = (Get-ChildItem resources/packs -Filter *.mizajpack | ForEach-Object { "$($_.Name) ($([math]::Round($_.Length/1KB,1)) KB)" }) -join ', '
          $report = @"

          ### Update sizes
          - Installer: $([math]::Round($exe.Length/1MB,1)) MB; blockmap: $([math]::Round($bm.Length/1KB,1)) KB.
          - Existing installs download only the changed blocks (electron-updater differential download, HTTP range requests against the blockmap), so a typical update is much smaller than the installer.
          - Model and data packs ship as .mizajpack assets (not inside the installer): $packs
          "@
          Add-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $report -Encoding utf8
          Write-Host $report
          "::notice title=Delta update::installer $([math]::Round($exe.Length/1MB,1)) MB, blockmap $([math]::Round($bm.Length/1KB,1)) KB"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mizaj-studio-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            desktop/sbom/sbom.json
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
            resources/packs/*.mizajpack

      - name: Set release notes
        if: steps.mode.outputs.publish == 'true'
        run: gh release edit "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --notes-file "$env:RUNNER_TEMP/release-notes.md"

      - name: Attach SBOM to the release
        if: steps.mode.outputs.publish == 'true'
        run: gh release upload "v${{ steps.version.outputs.version }}" desktop/sbom/sbom.json --repo "${{ github.repository }}" --clobber

      - name: Upload domain packs as release assets (catalog download URLs)
        if: steps.mode.outputs.publish == 'true'
        run: gh release upload "v${{ steps.version.outputs.version }}" (Get-ChildItem resources/packs -Filter *.mizajpack).FullName --repo "${{ github.repository }}" --clobber

      - name: Verify release assets
        if: steps.mode.outputs.publish == 'true'
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $rel = gh release view "v$v" --repo "${{ github.repository }}" --json assets,isDraft | ConvertFrom-Json
          if ($rel.isDraft) { throw "Release v$v is still a draft" }
          $names = $rel.assets | ForEach-Object { $_.name }
          Write-Host "assets: $($names -join ', ')"
          $packs = (Get-ChildItem resources/packs -Filter *.mizajpack).Name
          if ($packs.Count -ne 3) { throw "Expected 3 .mizajpack files, found $($packs.Count)" }
          foreach ($need in @("Mizaj-Studio-Setup-$v.exe", 'latest.yml', 'sbom.json') + $packs) {
            if ($names -notcontains $need) { throw "Missing release asset: $need" }
          }
          # the catalog points at releases/latest/download/<name>: the published bytes must match
          $catalog = Get-Content backend/app/resources/catalog.json -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($e in ($catalog.resources | Where-Object { $_.kind -eq 'mizajpack' })) {
            $asset = $rel.assets | Where-Object { $_.name -eq $e.filename }
            if ($asset.size -ne $e.size) { throw "$($e.filename): published size $($asset.size) != catalog $($e.size)" }
            $local = (Get-FileHash "resources/packs/$($e.filename)" -Algorithm SHA256).Hash.ToLower()
            if ($local -ne $e.sha256) { throw "$($e.filename): built sha256 $local != catalog $($e.sha256)" }
          }
