name: Tanzil probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - run: pip install -r backend/requirements.txt
      - name: Download and validate both Tanzil scripts with the app's own code
        working-directory: backend
        shell: python
        run: |
          import sys; sys.path.insert(0, '.')
          from app.quran import store
          for kind in ("simple", "uthmani"):
              try:
                  raw = store._post_with_retries(store._default_post, store.DOWNLOAD_ENDPOINT, store._form_fields(kind))
                  rep = store.validate_tanzil_text(raw.decode("utf-8"))
                  print(f"::notice title={kind}::OK {len(raw)} bytes; " + str({k: v for k, v in rep.items() if k != 'notice'})[:300])
              except Exception as e:
                  print(f"::error title={kind}::{type(e).__name__}: {getattr(e, 'details', '')} {e}")
