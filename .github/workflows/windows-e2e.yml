name: Windows E2E

# Task 7.7.1: build the installer like the release workflow (real models, INT8 quantization,
# frozen engine; nothing is published), install it silently, then drive the INSTALLED app with
# Playwright _electron in REAL engine mode (no MIZAJ_ENGINE_MODE=mock anywhere).
# Spec: desktop/tests/win-e2e/installed.spec.ts. Logs are not reachable from outside the runner, so
# failures are surfaced as annotations (and the log tail / screenshots are uploaded as artifacts).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    name: Installed app, real engine
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Reproducible-build environment
        run: |
          $epoch = (git log -1 --format=%ct).Trim()
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV
          'PYTHONHASHSEED=0' >> $env:GITHUB_ENV

      - name: Set an explicit dev version for the E2E build
        working-directory: desktop
        env:
          RELEASE_VERSION: 0.0.0-e2e
        run: node scripts/sync-version.cjs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt
          Push-Location desktop
          npm ci
          Pop-Location

      - name: Download CATT models (sha256 verified)
        run: python scripts/download_models.py

      - name: Quantize CATT encoder to INT8 (fails if DER regresses > 0.3 pt)
        env:
          MIZAJ_ENGINE_MODE: real
        run: python scripts/quantize_catt.py --guard 0.3

      - name: Build frozen engine
        run: python scripts/build_backend.py

      - name: Build the offline user guide
        run: |
          python -m pip install markdown==3.7
          python docs/guide/build.py docs/guide/dist --offline
      - name: Build app and package the installer (no publish)
        working-directory: desktop
        env:
          # Playwright needs --inspect on the packaged exe; release builds keep that fuse OFF (build/afterPack.cjs).
          MIZAJ_E2E_BUILD: '1'
        run: |
          npm run build
          npx electron-builder --win --publish never

      # CI runner only: the freshly built, unsigned installer intermittently crashes (0xC0000005)
      # while Defender real-time scanning inspects it. Exclude the build and install folders here
      # to tell a scanner interaction apart from a real installer bug (users are not affected by this).
      - name: Exclude build and install folders from Defender (runner only)
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\desktop\dist", "$env:LOCALAPPDATA\Programs\Mizaj Studio", "$env:TEMP"
          Write-Host "::notice title=Defender::runner exclusions added for dist, install dir and TEMP"

      - name: Silently install the NSIS build
        id: inst
        run: |
          $setup = Get-ChildItem desktop/dist -Filter 'Mizaj-Studio-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) {
            Write-Host '::error title=Windows E2E install::no installer was produced in desktop/dist'
            exit 1
          }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -eq -1073741819) {
            # Intermittent access violation inside the stock NSIS installer on hosted runners
            # (seen with Defender real-time scanning). Retry once and record it.
            Write-Host "::warning title=Installer::installer crashed (0xC0000005); retrying once"
            Start-Sleep -Seconds 10
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=Windows E2E install::installer exited with code $($p.ExitCode)"
            exit 1
          }
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles")
          $exe = Get-ChildItem -Path $roots -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Uninstall|mizaj-engine|elevate' -and $_.DirectoryName -match 'Mizaj' } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Host '::error title=Windows E2E install::installed executable not found'
            exit 1
          }
          Write-Host "::notice title=Windows E2E::installed $($exe.FullName) ($($exe.VersionInfo.ProductVersion))"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run the installed-app E2E (real engine)
        working-directory: desktop
        env:
          MIZAJ_INSTALLED_EXE: ${{ steps.inst.outputs.exe }}
          MIZAJ_E2E_USERDATA: ${{ runner.temp }}\win-e2e-userdata
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item Env:MIZAJ_ENGINE_MODE -ErrorAction SilentlyContinue
          $ud = $env:MIZAJ_E2E_USERDATA
          New-Item -ItemType Directory -Force -Path $ud | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'playwright-output.txt'
          function Esc([string]$t) { $t.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A') }
          function Tail([string]$path, [int]$n) {
            if (Test-Path $path) { Esc ((Get-Content $path -Tail $n) -join "`n") } else { "(file missing: $path)" }
          }
          # Everything Playwright prints is captured (stdout + stderr) and echoed to the log.
          & npx playwright test -c playwright.win.config.ts 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error title=Windows E2E failed (exit $code), Playwright output::$(Tail $out 40)"
            Write-Host "::error title=Windows E2E notes (spec)::$(Tail (Join-Path $ud 'e2e-notes.log') 40)"
            Write-Host "::error title=Windows E2E Electron stdout/stderr::$(Tail (Join-Path $ud 'electron-output.log') 25)"
            Write-Host "::error title=Windows E2E app main log::$(Tail (Join-Path $ud 'logs\mizaj-main.log') 25)"
            Get-ChildItem (Join-Path $ud 'logs') -Filter *.log -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne 'mizaj-main.log' } |
              ForEach-Object { Write-Host "::error title=Windows E2E backend log $($_.Name)::$(Tail $_.FullName 25)" }
            if (-not (Test-Path (Join-Path $ud 'e2e-notes.log'))) {
              Write-Host "::error title=Windows E2E::the spec never started (no notes file); see Playwright output above. userData: $((Get-ChildItem $ud -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', ')"
            }
            exit $code
          }
          $summary = (Get-Content $out | Where-Object { $_ -match '\d+ passed' } | Select-Object -Last 1)
          Write-Host "::notice title=Windows E2E passed::$summary"

      - name: Stop leftover processes
        if: always()
        run: |
          Get-Process | Where-Object { $_.Path -match 'Mizaj' } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-failure
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}\win-e2e-userdata\logs
            ${{ runner.temp }}\win-e2e-userdata\*.png
            desktop/test-results

  # «مِزَاج في أي برنامج»: the REAL Windows automation (PowerShell helper, SendInput, clipboard, Word COM)
  # against Notepad (and Word when the runner has it). No installer and no Python are needed: the
  # backend is a deterministic fake, this job is about the OS side. Spec: desktop/src/main/systemwide/winSmoke.test.ts
  systemwide-smoke:
    name: System-wide (Notepad round trip, clipboard restore, Word if installed)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Parse the helper scripts with Windows PowerShell 5.1 (what users run)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in (Get-ChildItem desktop/resources/systemwide/*.ps1), (Get-Item desktop/tests/win-smoke/word-fixture.ps1)) {
            $errs = $null; $tok = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tok, [ref]$errs)
            if ($errs.Count) { $errs | ForEach-Object { Write-Host "::error file=$($f.FullName),line=$($_.Extent.StartLineNumber)::$($_.Message)" }; $bad++ }
            else { Write-Host "OK $($f.Name)" }
          }
          if ($bad) { exit 1 }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run the system-wide smoke test
        working-directory: desktop
        env:
          MIZAJ_WIN_SMOKE: '1'
        run: npx vitest run src/main/systemwide/winSmoke.test.ts --reporter verbose

      - name: Stop leftover processes
        if: always()
        run: |
          Get-Process notepad, WINWORD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
