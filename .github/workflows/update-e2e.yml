name: Update E2E

# End-to-end test of the in-app auto-updater on real Windows: install an OLD version,
# let it discover the NEW one, download it, restart & install, then verify the installed
# version changed and the app relaunched.
#   mode=local  : build two installers (99.0.0 -> 99.0.1) from this commit and serve the
#                 newer one from a local feed (MIZAJ_UPDATE_FEED_URL). Tests the current code.
#   mode=github : install published release <from_version> and update to the latest GitHub release.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'local (build two versions of this commit) or github (published releases)'
        required: true
        type: choice
        options: [local, github]
        default: local
      from_version:
        description: 'github mode: old published version to install first (e.g. 0.1.0)'
        required: false
        type: string
        default: '0.1.0'

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set up Python (local mode)
        if: inputs.mode == 'local'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Build two installers 99.0.0 and 99.0.1 (local mode)
        if: inputs.mode == 'local'
        shell: pwsh
        run: |
          function Step($name, [scriptblock]$cmd) {
            Write-Host "== $name"
            $out = & $cmd 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              $tail = (($out -split "`n") | Select-Object -Last 20) -join "`n"
              $tail = $tail.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              Write-Host "::error title=Local build::$name failed with exit code $LASTEXITCODE%0A$tail"
              exit 1
            }
          }
          Step 'pip install' { pip install -r backend/requirements.txt -r backend/requirements-build.txt }
          Step 'download models' { python scripts/download_models.py }
          Step 'freeze engine' { python scripts/build_backend.py }
          Push-Location desktop
          # test builds only: Playwright needs the Node-inspect fuse (release builds keep it OFF, see build/afterPack.cjs)
          $env:MIZAJ_E2E_BUILD = '1'
          Step 'npm run build' { npm run build }
          Step 'package 99.0.0' { npx electron-builder --win --publish never '--config.extraMetadata.version=99.0.0' '--config.directories.output=dist-a' }
          Step 'package 99.0.1' { npx electron-builder --win --publish never '--config.extraMetadata.version=99.0.1' '--config.directories.output=dist-b' }
          $files = (Get-ChildItem dist-b -File | ForEach-Object { "$($_.Name) ($($_.Length))" }) -join ', '
          Write-Host "::notice title=Local build::dist-b: $files"
          Pop-Location

      - name: Resolve versions
        id: v
        shell: pwsh
        run: |
          if ('${{ inputs.mode }}' -eq 'local') {
            "from=99.0.0" >> $env:GITHUB_OUTPUT
            "latest=99.0.1" >> $env:GITHUB_OUTPUT
            "installer=$env:GITHUB_WORKSPACE\desktop\dist-a\Mizaj-Studio-Setup-99.0.0.exe" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $latest = (gh release view --repo ${{ github.repository }} --json tagName | ConvertFrom-Json).tagName.TrimStart('v')
          $from = '${{ inputs.from_version }}'
          if ([version]$latest -le [version]$from) { throw "Latest release $latest is not newer than $from" }
          gh release download "v$from" --repo ${{ github.repository }} --pattern "Mizaj-Studio-Setup-$from.exe" --dir "$env:RUNNER_TEMP\old"
          "from=$from" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT
          "installer=$env:RUNNER_TEMP\old\Mizaj-Studio-Setup-$from.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Updating $from -> $latest"

      - name: Silently install the old version
        shell: pwsh
        run: |
          $inst = '${{ steps.v.outputs.installer }}'
          if (-not (Test-Path $inst)) {
            $near = (Get-ChildItem (Split-Path $inst) -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
            Write-Host "::error title=Install old version::installer not found: $inst (dir has: $near)"
            exit 1
          }
          $p = Start-Process -FilePath $inst -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=Install old version::installer $inst exited with code $($p.ExitCode)"
            exit 1
          }

      - name: Locate installed app and check its version
        id: app
        shell: pwsh
        run: |
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles")
          $exe = Get-ChildItem -Path $roots -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Uninstall|mizaj-engine|elevate' -and $_.DirectoryName -match 'Mizaj' } |
            Select-Object -First 1
          if (-not $exe) { throw 'installed Mizaj Studio executable not found' }
          $ver = $exe.VersionInfo.ProductVersion
          Write-Host "installed: $($exe.FullName) version $ver"
          if (-not $ver.StartsWith('${{ steps.v.outputs.from }}')) { throw "expected ${{ steps.v.outputs.from }}, got $ver" }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # One step on purpose: Actions kills processes a step started when the step ends,
      # which would kill the NSIS installer launched by quitAndInstall.
      - name: Update via the in-app updater and verify the new version
        shell: pwsh
        run: |
          $exe = '${{ steps.app.outputs.exe }}'
          $want = '${{ steps.v.outputs.latest }}'
          $ud = "$env:RUNNER_TEMP\userdata"
          if ('${{ inputs.mode }}' -eq 'local') {
            # Same step as the update: Actions kills a step's processes when it ends.
            $feed = Start-Process -FilePath python -ArgumentList @('-m','http.server','8765','--bind','127.0.0.1','--directory',"$env:GITHUB_WORKSPACE\desktop\dist-b") -PassThru -WindowStyle Hidden
            $env:MIZAJ_UPDATE_FEED_URL = 'http://127.0.0.1:8765/'
            $env:MIZAJ_ENGINE_MODE = 'mock'
            Start-Sleep -Seconds 2
          }
          Push-Location desktop
          if ('${{ inputs.mode }}' -eq 'local') {
            node scripts/update-e2e.mjs "$exe" "$want" "$ud"
          } else {
            # Release builds have the inspect fuse off, so Playwright cannot attach:
            # drive the banner through Windows UI Automation instead.
            python -m pip install --quiet pywinauto==0.6.8
            python scripts/update-e2e-uia.py "$exe" "$want" "$ud"
          }
          $uiExit = $LASTEXITCODE
          Pop-Location
          if ($uiExit -ne 0) { throw "updater UI flow failed ($uiExit)" }
          $deadline = (Get-Date).AddMinutes(6)
          do {
            Start-Sleep -Seconds 5
            $ver = if (Test-Path $exe) { (Get-Item $exe).VersionInfo.ProductVersion } else { '(missing)' }
            $inst = Get-Process | Where-Object { $_.Path -and $_.Path -match 'Setup|installer|nsis|Un_A' } | Select-Object -ExpandProperty Path
            Write-Host "installed version: $ver | installer processes: $($inst -join ', ')"
          } until ($ver.StartsWith($want) -or (Get-Date) -gt $deadline)
          if (-not $ver.StartsWith($want)) {
            $diag = @()
            $upd = Get-ChildItem "$env:LOCALAPPDATA" -Directory -Filter '*updater*' -ErrorAction SilentlyContinue
            foreach ($d in $upd) { $diag += "updater dir $($d.FullName): " + ((Get-ChildItem $d.FullName -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', ') }
            $wins = Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName) [$($_.Id)] '$($_.MainWindowTitle)' $($_.Path)" }
            $diag += "windows: " + ($wins -join ' | ')
            $procs = Get-Process | Where-Object { $_.Path -match 'Mizaj|mizaj|updater' } | ForEach-Object { "$($_.ProcessName) $($_.Path)" }
            $diag += "mizaj processes: " + ($procs -join ' | ')
            $mainLog = Join-Path $ud 'logs\mizaj-main.log'
            if (Test-Path $mainLog) { $diag += (Get-Content $mainLog -Tail 8) }
            $msg = ("installed version is $ver, expected $want`n" + ($diag -join "`n")).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=Update E2E::$msg"
            throw 'update was not installed'
          }
          # The installer replaces files first and launches the app at the very end.
          $relaunchDeadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 3
            $running = Get-Process | Where-Object { $_.Path -and ($_.Path -ieq $exe) }
          } until ($running -or (Get-Date) -gt $relaunchDeadline)
          $others = (Get-Process | Where-Object { $_.Path -match 'Mizaj' } | ForEach-Object { $_.Path }) -join ', '
          Write-Host "relaunched processes: $($running.Count); mizaj-related: $others"
          if (-not $running) { Write-Host "::warning title=Update E2E::app was not relaunched after install (mizaj processes: $others)" }
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process mizaj-engine -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "::notice title=Update E2E::updated ${{ steps.v.outputs.from }} -> $ver successfully (relaunched: $($running.Count -gt 0))"

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-e2e-failure
          path: desktop/update-e2e-failure.png
          if-no-files-found: ignore
