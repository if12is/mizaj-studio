[project]
name = "mizaj-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "app/engine/catt/bw2ar.py", "app/engine/catt/tokenizer.py", "app/engine/catt/utils.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
